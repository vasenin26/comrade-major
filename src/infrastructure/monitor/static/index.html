<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent Monitor</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1a1d26;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #8b93a7;
      --user: #6cb6ff;
      --assistant: #7dcea0;
      --inner: #c39bd3;
      --system: #f0b27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    #status {
      font-size: 0.8rem;
      color: var(--muted);
    }
    #status.connected { color: var(--assistant); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
    }
    section {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    section h2 {
      margin: 0;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .scroll {
      flex: 1;
      overflow: auto;
      padding: 0.75rem 1rem;
    }
    .msg {
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .role {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.03em;
    }
    .role[data-role="user"] { color: var(--user); }
    .role[data-role="assistant"] { color: var(--assistant); }
    .role[data-role="inner"] { color: var(--inner); }
    .role[data-role="system"] { color: var(--system); }
    .content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Voice Agent Monitor</h1>
    <span id="status">connecting…</span>
  </header>
  <main>
    <section>
      <h2>Message log</h2>
      <div id="log" class="scroll"></div>
    </section>
    <section>
      <h2>Conversation context</h2>
      <div id="context" class="scroll"></div>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    const contextEl = document.getElementById("context");
    const statusEl = document.getElementById("status");

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function renderMessage(container, role, content, ts) {
      const div = document.createElement("div");
      div.className = "msg";
      const meta = ts
        ? `<div class="meta"><span class="role" data-role="${escapeHtml(role)}">${escapeHtml(role)}</span> · ${escapeHtml(ts)}</div>`
        : `<div class="meta"><span class="role" data-role="${escapeHtml(role)}">${escapeHtml(role)}</span></div>`;
      div.innerHTML = `${meta}<div class="content">${escapeHtml(content)}</div>`;
      container.appendChild(div);
    }

    function appendLog(event) {
      renderMessage(logEl, event.role, event.content, event.ts || "");
      logEl.scrollTop = logEl.scrollHeight;
    }

    function renderContext(messages) {
      contextEl.innerHTML = "";
      for (const msg of messages) {
        renderMessage(contextEl, msg.role, msg.content, null);
      }
      contextEl.scrollTop = contextEl.scrollHeight;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        statusEl.textContent = "connected";
        statusEl.className = "connected";
      };
      ws.onclose = () => {
        statusEl.textContent = "disconnected — retrying…";
        statusEl.className = "";
        setTimeout(connect, 1500);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if (data.type === "log") appendLog(data);
        if (data.type === "context") renderContext(data.messages || []);
      };
    }

    connect();
  </script>
</body>
</html>
